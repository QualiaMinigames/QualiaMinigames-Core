name: Publish

# Publishes only on `v*` tags.
#
# Deliberately **not** on pushes to main: publishing to crates.io is **irreversible**, and
# once a version number is taken it exists forever (yank only stops new dependency
# resolution; it does not remove what others already downloaded). Publishing must be an
# explicit action, not a side effect of merging to the main branch.
on:
  push:
    tags:
      - 'v*'
  # A manual run only verifies the package; it never publishes.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Verify first: the tag must name the version in Cargo.toml, and the package must build on
  # every platform this project's development happens on.
  #
  # Why more than one platform: `cargo publish` only checks the current platform, so a
  # package that builds on Linux can fail to package on Windows because of a path in a
  # `cfg` branch, and by then the version number is spent.
  verify:
    name: Verify packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $manifest in Cargo.toml"
            exit 1
          fi

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: verify
    # A manual trigger only runs verification, never publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The last step creates a Release, which needs write access to the repository contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check whether this version is already on crates.io
        # A tag may be moved to a rewritten commit, which fires this workflow again.
        # Publishing is irreversible, so "already published" is nothing to do rather than a
        # failure.
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl -sf -o /dev/null "https://crates.io/api/v1/crates/qualia-minigames-core/${version}"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::qualia-minigames-core ${version} is already published, skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # The token is injected only in the publishing step: verification does not need it,
        # so it must not appear in that job's environment.
        if: steps.registry.outputs.already != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_KEY }}
        run: cargo publish --locked

      - name: Create the release
        # Reached only after `cargo publish` succeeded: a failing previous step aborts the
        # job. Deliberately without `set -e`, because "the crate is on crates.io but the
        # GitHub Release is missing" must not turn the whole run red and read as a failed
        # publication. The failure is a warning, and it only affects whether that Release
        # exists.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<NOTES
          \`qualia-minigames-core\` $GITHUB_REF_NAME is published on crates.io.
          NOTES
          if gh release create "$GITHUB_REF_NAME" \
               --title "$GITHUB_REF_NAME" \
               --notes-file notes.md \
               --verify-tag; then
            echo "Created GitHub Release $GITHUB_REF_NAME"
          else
            echo "::warning::the crate reached crates.io, but creating the GitHub Release failed. The publication is unaffected."
          fi
